services:
  api:
    image: souvik73/fastapi
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8000"
    environment:
      DATABASE_HOSTNAME: postgres
      DATABASE_PORT: "5432"
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env.production}
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in .env.production}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env.production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-30}"

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env.production}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env.production}
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME in .env.production}
    volumes:
      - postgres-db-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-db-v18:
